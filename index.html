<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nossa Viagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff8f0;
      --surface: #ffffff;
      --ink: #2b2118;
      --muted: #7a6a5c;
      --line: #f0e2d2;
      --accent: #e8590c;
      --accent-soft: #ffe8d6;
      --sea: #0c8599;
      --sea-soft: #d6f3f7;
      --ok: #2b8a3e;
      --shadow: 0 6px 24px rgba(120, 70, 20, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17120e;
        --surface: #221b15;
        --ink: #f6ece2;
        --muted: #b3a291;
        --line: #3a2e24;
        --accent: #ff8a3d;
        --accent-soft: #3d2615;
        --sea: #3bc9db;
        --sea-soft: #12343a;
        --ok: #69db7c;
        --shadow: 0 6px 24px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      line-height: 1.5;
    }
    h1, h2, h3 { font-family: "Fraunces", Georgia, serif; line-height: 1.15; margin: 0; }
    a { color: var(--sea); }

    /* ---------- Topo ---------- */
    .hero {
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 35%, rgba(255,255,255,.18) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.15) 0 2px, transparent 3px),
        linear-gradient(160deg, #f76707 0%, #e8590c 40%, #0c8599 100%);
      background-size: 120px 120px, 160px 160px, 140px 140px, 100% 100%;
      color: #fff;
      padding: 48px 16px 64px;
      text-align: center;
    }
    .hero .destino {
      display: inline-block;
      background: rgba(255,255,255,.2);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: .04em;
      font-size: .85rem;
      text-transform: uppercase;
    }
    .hero h1 { font-size: clamp(1.9rem, 6vw, 3.2rem); margin: 14px auto 6px; max-width: 760px; }
    .hero p { margin: 0 0 28px; opacity: .95; font-size: 1.1rem; }
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }
    .countdown div {
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 18px;
      padding: 14px 4px;
      backdrop-filter: blur(4px);
    }
    .countdown strong {
      display: block;
      font-family: "Fraunces", serif;
      font-size: clamp(1.8rem, 8vw, 3rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .countdown span { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; opacity: .9; }
    .hero .sub { margin-top: 18px; font-size: .95rem; opacity: .9; }
    .chegou { font-family: "Fraunces", serif; font-size: clamp(1.6rem, 6vw, 2.4rem); }

    /* ---------- Menu ---------- */
    nav {
      position: sticky; top: 0; z-index: 5;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex; gap: 4px; overflow-x: auto;
      padding: 8px 12px;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      flex: none;
      text-decoration: none; color: var(--ink);
      padding: 8px 14px; border-radius: 999px;
      font-weight: 600; font-size: .95rem;
    }
    nav a:hover { background: var(--accent-soft); }

    /* ---------- Seções ---------- */
    main { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; }
    section { padding-top: 40px; scroll-margin-top: 56px; }
    section > h2 { font-size: 1.7rem; margin-bottom: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    .big { font-size: 1.15rem; font-weight: 800; }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block; background: var(--sea-soft); color: var(--sea);
      padding: 2px 10px; border-radius: 999px; font-weight: 800; font-size: .85rem;
    }

    /* Hotel */
    .hotel h3 { font-size: 1.4rem; margin-bottom: 4px; }
    .hotel .rows { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: 16px 0; }
    .map { width: 100%; height: 260px; border: 0; border-radius: 14px; margin-top: 12px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff; text-decoration: none;
      padding: 10px 16px; border-radius: 12px; font-weight: 800; border: 0;
      font-family: inherit; font-size: .95rem; cursor: pointer;
    }
    .btn.ghost { background: var(--accent-soft); color: var(--accent); }

    /* Roteiro */
    .day { margin-bottom: 14px; }
    .day header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .day h3 { font-size: 1.25rem; }
    .day.hoje { outline: 3px solid var(--accent); }
    .day.passou { opacity: .55; }
    .ativ { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
    .ativ:first-of-type { border-top: 0; }
    .ativ time { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .ativ .nome { font-weight: 800; }
    .ativ .local { color: var(--muted); font-size: .95rem; }
    .ativ .local a { color: inherit; }
    .ativ .obs { font-size: .9rem; background: var(--accent-soft); display: inline-block; padding: 2px 8px; border-radius: 8px; margin-top: 4px; }

    /* Checklist */
    .progress { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
    .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--sea)); transition: width .3s; }
    .quem { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .quem input, .add input {
      flex: 1; min-width: 0;
      font: inherit; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    }
    .cat { margin-top: 18px; }
    .cat h3 { font-family: "Nunito", sans-serif; font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 10px; }
    .item:hover { background: var(--bg); }
    .item input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
    .item label { flex: 1; cursor: pointer; }
    .item.done label { text-decoration: line-through; color: var(--muted); }
    .item .del { background: none; border: 0; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 2px 6px; }
    .add { display: flex; gap: 8px; margin-top: 6px; }
    .add button { flex: none; }

    /* Contatos */
    .contato { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .contato:first-child { border-top: 0; }
    .contato a { font-weight: 800; text-decoration: none; white-space: nowrap; }

    /* Destinos */
    .etapas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .etapa { position: relative; }
    .etapa .emoji { font-size: 2rem; }
    .etapa .num { position: absolute; top: 14px; right: 16px; color: var(--muted); font-weight: 800; }

    /* Voos */
    .voo-rota { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 10px 0; }
    .voo-rota .ap { font-family: "Fraunces", serif; font-size: 1.7rem; font-weight: 800; line-height: 1; }
    .voo-rota .dir { text-align: right; }
    .voo-rota .seta { color: var(--muted); font-size: 1.3rem; }
    .hotel + .hotel { margin-top: 14px; }

    footer { text-align: center; color: var(--muted); padding: 24px 16px 40px; font-size: .9rem; }

    /* Botão de idioma */
    .lang {
      position: absolute; top: 14px; right: 16px;
      display: flex; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px; padding: 3px;
    }
    .lang button {
      border: 0; background: none; color: #fff; font: inherit; font-weight: 800; font-size: .85rem;
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .lang button[aria-pressed="true"] { background: #fff; color: var(--accent); }
    .hero { position: relative; padding-top: 68px; }
    #destinos { padding-top: 24px; }
  </style>
</head>
<body>

  <header class="hero">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button data-lang="pt" aria-pressed="true">🇧🇷 PT</button>
      <button data-lang="en" aria-pressed="false">🇺🇸 EN</button>
    </div>
    <span class="destino" id="destino"></span>
    <h1 id="titulo"></h1>
    <p id="frase"></p>
    <div id="contador">
      <div class="countdown">
        <div><strong id="d">0</strong><span data-i18n="dias"></span></div>
        <div><strong id="h">0</strong><span data-i18n="horas"></span></div>
        <div><strong id="m">0</strong><span data-i18n="min"></span></div>
        <div><strong id="s">0</strong><span data-i18n="seg"></span></div>
      </div>
    </div>
    <div class="sub" id="sub"></div>
  </header>

  <nav>
    <a href="#destinos" data-i18n="navDestinos"></a>
    <a href="#voos" data-i18n="navTrajetos"></a>
    <a href="#hotel" data-i18n="navHoteis"></a>
    <a href="#roteiro" data-i18n="navRoteiro"></a>
    <a href="#checklist" data-i18n="navChecklist"></a>
    <a href="#contatos" data-i18n="navContatos"></a>
  </nav>

  <main>
    <section id="destinos">
      <h2 data-i18n="tDestinos"></h2>
      <div class="etapas" id="etapas"></div>
    </section>

    <section id="voos">
      <h2 data-i18n="tTrajetos"></h2>
      <p class="muted" style="margin-top:-8px" data-i18n="horaLocal"></p>
      <div class="grid" id="listaVoos"></div>
    </section>

    <section id="hotel">
      <h2 data-i18n="tHoteis"></h2>
      <div id="listaHoteis"></div>
    </section>

    <section id="roteiro">
      <h2 data-i18n="tRoteiro"></h2>
      <div id="dias"></div>
    </section>

    <section id="checklist">
      <h2 data-i18n="tChecklist"></h2>
      <div class="card">
        <div class="quem">
          <span class="label" data-i18n="checklistDe"></span>
          <input id="pessoa" maxlength="30">
        </div>
        <div class="muted" id="progressoTxt"></div>
        <div class="progress"><div id="barra"></div></div>
        <div id="cats"></div>
        <div class="btns" style="margin-top:20px">
          <button class="btn ghost" id="limpar" data-i18n="desmarcar"></button>
        </div>
        <p class="muted" style="font-size:.85rem;margin-bottom:0" data-i18n="salvoAqui"></p>
      </div>
    </section>

    <section id="contatos">
      <h2 data-i18n="tContatos"></h2>
      <div class="card" id="listaContatos"></div>
    </section>
  </main>

  <footer data-i18n="rodape"></footer>

  <script src="viagem.js"></script>
  <script>
    const V = VIAGEM;
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const store = {
      get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };

    // ---------- Textos fixos do site ----------
    const UI = {
      pt: {
        dias: "dias", horas: "horas", min: "min", seg: "seg",
        ateAPartida: "até a partida", as: "às",
        ferias: "🎉 Estamos de férias! Aproveitem! 🎉", volta: "Chegada em casa",
        fim: "Que viagem incrível! Até a próxima 💛",
        navDestinos: "🌎 Destinos", navTrajetos: "✈️ Trajetos", navHoteis: "🏨 Hospedagem",
        navRoteiro: "🗺️ Roteiro", navChecklist: "✅ Checklist", navContatos: "📞 Contatos",
        tDestinos: "Destinos", tTrajetos: "Voos e estradas", tHoteis: "Onde vamos ficar",
        tRoteiro: "Roteiro dia a dia", tChecklist: "Checklist da mala", tContatos: "Contatos importantes",
        horaLocal: "Todos os horários estão no horário local de cada cidade.",
        deCarro: "🚗 De carro", vooAConfirmar: "Voo a confirmar", aConfirmar: "a confirmar",
        checkin: "Check-in", checkout: "Check-out", estadia: "Estadia",
        noite: "noite", noites: "noites", enderecoAConfirmar: "Endereço a confirmar",
        abrirMapa: "🗺️ Abrir no mapa", site: "🌐 Site", hoje: "HOJE",
        checklistDe: "Checklist de:", seuNome: "Seu nome (ex.: Ana)",
        adicionar: "Adicionar item...", remover: "Remover",
        desmarcar: "Desmarcar tudo", confirmaDesmarcar: "Desmarcar todos os itens?",
        prontos: (f, t, p) => `${f} de ${t} itens prontos (${p}%)`, malaPronta: "🎉 Mala pronta! Tudo certo!",
        salvoAqui: "As marcações ficam salvas neste celular/computador. Cada pessoa da família usa o seu.",
        rodape: "Feito com ❤️ para a nossa família",
      },
      en: {
        dias: "days", horas: "hours", min: "min", seg: "sec",
        ateAPartida: "until departure", as: "at",
        ferias: "🎉 We're on vacation! Enjoy! 🎉", volta: "Back home",
        fim: "What an amazing trip! See you next time 💛",
        navDestinos: "🌎 Destinations", navTrajetos: "✈️ Travel", navHoteis: "🏨 Stays",
        navRoteiro: "🗺️ Itinerary", navChecklist: "✅ Checklist", navContatos: "📞 Contacts",
        tDestinos: "Destinations", tTrajetos: "Flights & drives", tHoteis: "Where we're staying",
        tRoteiro: "Day-by-day itinerary", tChecklist: "Packing checklist", tContatos: "Important contacts",
        horaLocal: "All times are local time in each city.",
        deCarro: "🚗 By car", vooAConfirmar: "Flight TBD", aConfirmar: "TBD",
        checkin: "Check-in", checkout: "Check-out", estadia: "Stay",
        noite: "night", noites: "nights", enderecoAConfirmar: "Address TBD",
        abrirMapa: "🗺️ Open in Maps", site: "🌐 Website", hoje: "TODAY",
        checklistDe: "Checklist for:", seuNome: "Your name (e.g. Ana)",
        adicionar: "Add item...", remover: "Remove",
        desmarcar: "Uncheck all", confirmaDesmarcar: "Uncheck all items?",
        prontos: (f, t, p) => `${f} of ${t} items packed (${p}%)`, malaPronta: "🎉 All packed! You're ready!",
        salvoAqui: "Your checks are saved on this phone/computer. Each family member uses their own.",
        rodape: "Made with ❤️ for our family",
      },
    };

    let lang = store.get("idioma", "pt") === "en" ? "en" : "pt";
    const L = () => UI[lang];
    const locale = () => (lang === "en" ? "en-US" : "pt-BR");
    // Texto que pode ser "simples" ou { pt, en }
    const tx = (v) => (v && typeof v === "object" ? v[lang] ?? v.pt ?? "" : v ?? "");

    // Datas "AAAA-MM-DD" ou "AAAA-MM-DDTHH:MM" lidas no horário local
    function data(txt) {
      const [d, t = "00:00"] = txt.split("T");
      const [a, m, dia] = d.split("-").map(Number);
      const [h, min] = t.split(":").map(Number);
      return new Date(a, m - 1, dia, h, min);
    }
    const fmtDia = (d) => d.toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" });
    const fmtCurto = (d) => d.toLocaleDateString(locale(), { weekday: "short", day: "2-digit", month: lang === "en" ? "short" : "2-digit" });
    const curto = (txt) => (txt ? fmtCurto(data(txt)) : L().aConfirmar);
    const mapa = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
    const tel = (t) => "tel:" + String(t).replace(/[^\d+]/g, "");

    // ---------- Contador ----------
    const partida = new Date(V.partida);
    const retorno = V.retorno ? data(V.retorno) : null;
    let timer = null;

    function tick() {
      const agora = new Date();
      const falta = partida - agora;
      if (falta > 0) {
        const s = Math.floor(falta / 1000);
        $("d").textContent = Math.floor(s / 86400);
        $("h").textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, "0");
        $("m").textContent = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
        $("s").textContent = String(s % 60).padStart(2, "0");
        const tz = { timeZone: "America/Sao_Paulo" };
        $("sub").textContent = `${L().ateAPartida} · ${partida.toLocaleDateString(locale(), { ...tz, weekday: "long", day: "numeric", month: "long" })} ${L().as} ${partida.toLocaleTimeString(locale(), { ...tz, hour: "2-digit", minute: "2-digit" })} (Curitiba)`;
        return false;
      }
      if (!retorno || agora < retorno) {
        $("contador").innerHTML = `<div class="chegou">${esc(L().ferias)}</div>`;
        $("sub").textContent = retorno ? `${L().volta}: ${fmtDia(retorno)}` : "";
      } else {
        $("contador").innerHTML = `<div class="chegou">${esc(L().fim)}</div>`;
        $("sub").textContent = "";
      }
      return true;
    }

    // ---------- Montagem da página ----------
    function renderTudo() {
      document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
      document.title = tx(V.titulo);
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = L()[el.dataset.i18n]; });
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
      $("pessoa").placeholder = L().seuNome;

      $("destino").textContent = "📍 " + tx(V.destino);
      $("titulo").textContent = tx(V.titulo);
      $("frase").textContent = tx(V.frase);
      if (!tick() && !timer) timer = setInterval(() => { if (tick()) { clearInterval(timer); timer = null; } }, 1000);

      // Destinos
      $("etapas").innerHTML = V.destinos.map((d, i) => `<div class="card etapa">
          <span class="num">${i + 1}</span>
          <div class="emoji">${esc(d.emoji)}</div>
          <div class="big">${esc(tx(d.cidade))}</div>
          <div><span class="pill">${esc(curto(d.de))} → ${esc(curto(d.ate))}</span></div>
          ${tx(d.obs) ? `<div class="muted" style="margin-top:8px;font-size:.92rem">${esc(tx(d.obs))}</div>` : ""}
        </div>`).join("");

      // Trajetos
      const horaPill = (h) => (h ? `<span class="pill">${esc(h)}</span>` : "");
      $("listaVoos").innerHTML = V.trajetos.map((v) => {
        const carro = v.tipo === "carro";
        const titulo = carro ? L().deCarro : "✈️ " + ([v.companhia, v.voo].filter(Boolean).join(" ") || L().vooAConfirmar);
        return `<div class="card">
          <div class="label">${esc(tx(v.trecho))}</div>
          <div class="big">${esc(titulo)}</div>
          <div class="voo-rota">
            <div><div class="ap">${esc(v.sai.sigla)}</div><div class="muted">${esc(tx(v.sai.cidade))}</div></div>
            <div class="seta">${carro ? "🛣️" : "✈"}</div>
            <div class="dir"><div class="ap">${esc(v.chega.sigla)}</div><div class="muted">${esc(tx(v.chega.cidade))}</div></div>
          </div>
          <div class="voo-rota" style="margin:0">
            <div>${horaPill(v.sai.hora)}<div class="muted" style="font-size:.9rem">${esc(curto(v.sai.data))}</div></div>
            <div></div>
            <div class="dir">${horaPill(v.chega.hora)}<div class="muted" style="font-size:.9rem">${carro ? "" : esc(curto(v.chega.data))}</div></div>
          </div>
          ${tx(v.obs) ? `<div class="muted" style="margin-top:10px">${esc(tx(v.obs))}</div>` : ""}
        </div>`;
      }).join("");

      // Hospedagens
      $("listaHoteis").innerHTML = V.hoteis.map((H) => {
        let noites = "";
        if (H.checkin && H.checkout) {
          const n = Math.round((data(H.checkout) - data(H.checkin)) / 86400000);
          noites = `${n} ${n === 1 ? L().noite : L().noites}`;
        }
        const nome = tx(H.nome);
        const q = H.endereco;
        return `<div class="card hotel">
          <div class="label">${esc(tx(H.cidade))}</div>
          <h3>${esc(nome)}</h3>
          <div class="muted">📍 ${esc(H.endereco || L().enderecoAConfirmar)}</div>
          <div class="rows">
            <div><div class="label">${L().checkin}</div><div class="big">${esc(curto(H.checkin))}</div></div>
            <div><div class="label">${L().checkout}</div><div class="big">${esc(curto(H.checkout))}</div></div>
            ${noites || H.reserva ? `<div><div class="label">${L().estadia}</div><div class="big">${esc(noites || "—")}</div><div class="muted">${esc(H.reserva)}</div></div>` : ""}
          </div>
          ${tx(H.obs) ? `<p style="margin:0">${esc(tx(H.obs))}</p>` : ""}
          <div class="btns">
            ${q ? `<a class="btn" href="${mapa(q)}" target="_blank" rel="noopener">${L().abrirMapa}</a>` : ""}
            ${H.telefone ? `<a class="btn ghost" href="${tel(H.telefone)}">📞 ${esc(H.telefone)}</a>` : ""}
            ${H.site ? `<a class="btn ghost" href="${esc(H.site)}" target="_blank" rel="noopener">${L().site}</a>` : ""}
          </div>
          ${q ? `<iframe class="map" loading="lazy" title="${esc(nome)}"
            src="https://maps.google.com/maps?q=${encodeURIComponent(q)}&output=embed"></iframe>` : ""}
        </div>`;
      }).join("");

      // Roteiro
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      $("dias").innerHTML = V.roteiro.map((d) => {
        const dia = data(d.dia);
        const cls = +dia === +hoje ? "hoje" : dia < hoje ? "passou" : "";
        return `<div class="card day ${cls}">
          <header>
            <h3>${esc(tx(d.titulo))}</h3>
            <span class="muted" style="text-transform:capitalize">${esc(fmtDia(dia))}</span>
            ${cls === "hoje" ? `<span class="pill">${L().hoje}</span>` : ""}
          </header>
          ${d.atividades.map((a) => `<div class="ativ">
            <time>${esc(a.hora || "—")}</time>
            <div>
              <div class="nome">${esc(tx(a.nome))}</div>
              ${a.local ? `<div class="local">📍 <a href="${mapa(tx(a.local))}" target="_blank" rel="noopener">${esc(tx(a.local))}</a></div>` : ""}
              ${tx(a.obs) ? `<div class="obs">💡 ${esc(tx(a.obs))}</div>` : ""}
            </div>
          </div>`).join("")}
        </div>`;
      }).join("");

      renderChecklist();

      // Contatos
      $("listaContatos").innerHTML = V.contatos.map((c) =>
        `<div class="contato"><span>${esc(tx(c.nome))}</span><a href="${tel(c.telefone)}">📞 ${esc(c.telefone)}</a></div>`
      ).join("");
    }

    // ---------- Checklist ----------
    // As marcações usam o texto em português como identificador,
    // então trocar de idioma não perde nada do que já foi marcado.
    let estado = store.get("checklist-estado", { marcados: {}, extras: {}, removidos: {} });
    const salvar = () => store.set("checklist-estado", estado);
    $("pessoa").value = store.get("checklist-nome", "");
    $("pessoa").addEventListener("input", (e) => store.set("checklist-nome", e.target.value));

    function renderChecklist() {
      let total = 0, feitos = 0;
      $("cats").innerHTML = V.checklist.map((grupo) => {
        const cat = grupo.categoria.pt ?? grupo.categoria;
        const lista = [
          ...grupo.itens.map((i) => ({ id: i.pt ?? i, txt: tx(i) })),
          ...(estado.extras[cat] || []).map((i) => ({ id: i, txt: i })),
        ].filter((i) => !estado.removidos[cat + "|" + i.id]);
        const html = lista.map((item) => {
          const key = cat + "|" + item.id;
          const ok = !!estado.marcados[key];
          total++; if (ok) feitos++;
          const id = "c" + btoa(unescape(encodeURIComponent(key))).replace(/[^a-z0-9]/gi, "");
          return `<div class="item ${ok ? "done" : ""}">
            <input type="checkbox" id="${id}" data-key="${esc(key)}" ${ok ? "checked" : ""}>
            <label for="${id}">${esc(item.txt)}</label>
            <button class="del" title="${L().remover}" data-del="${esc(key)}">×</button>
          </div>`;
        }).join("");
        return `<div class="cat">
          <h3>${esc(tx(grupo.categoria))}</h3>
          ${html}
          <form class="add" data-cat="${esc(cat)}">
            <input placeholder="${esc(L().adicionar)}" maxlength="80">
            <button class="btn ghost" type="submit">+</button>
          </form>
        </div>`;
      }).join("");
      const pct = total ? Math.round((feitos / total) * 100) : 0;
      $("barra").style.width = pct + "%";
      $("progressoTxt").textContent = pct === 100 ? L().malaPronta : L().prontos(feitos, total, pct);
    }

    $("cats").addEventListener("change", (e) => {
      const k = e.target.dataset.key; if (!k) return;
      if (e.target.checked) estado.marcados[k] = true; else delete estado.marcados[k];
      salvar(); renderChecklist();
    });
    $("cats").addEventListener("click", (e) => {
      const k = e.target.dataset.del; if (!k) return;
      estado.removidos[k] = true; delete estado.marcados[k];
      salvar(); renderChecklist();
    });
    $("cats").addEventListener("submit", (e) => {
      e.preventDefault();
      const cat = e.target.dataset.cat;
      const txt = e.target.querySelector("input").value.trim();
      if (!txt) return;
      estado.extras[cat] = [...(estado.extras[cat] || []), txt];
      delete estado.removidos[cat + "|" + txt];
      salvar(); renderChecklist();
    });
    $("limpar").addEventListener("click", () => {
      if (confirm(L().confirmaDesmarcar)) { estado.marcados = {}; salvar(); renderChecklist(); }
    });

    // ---------- Troca de idioma ----------
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
      lang = b.dataset.lang;
      store.set("idioma", lang);
      renderTudo();
    }));

    renderTudo();
  </script>
</body>
</html>
