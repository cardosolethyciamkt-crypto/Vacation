<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: céu noturno com painel de embarque no topo; abaixo, papel frio com cartões de embarque e linha do tempo. */
  :root {
    --paper: #f5f6f8;
    --surface: #ffffff;
    --ink: #0f1b2d;
    --muted: #5d6a7d;
    --line: #e2e6ec;
    --gold: #a87a2c;
    --gold-soft: #f4ecdd;
    --ok: #2f7d5b;
    /* topo sempre noturno */
    --night: #0a1222;
    --night-2: #13203a;
    --night-ink: #eef2f8;
    --night-muted: #93a1b8;
    --night-gold: #e0bd76;
    --night-line: rgba(255, 255, 255, .12);

    --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0b111c; --surface: #121a28; --ink: #e8ecf2; --muted: #8f9bae;
      --line: #222c3d; --gold: #d9b36a; --gold-soft: #2a2416; --ok: #6cc59c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0b111c; --surface: #121a28; --ink: #e8ecf2; --muted: #8f9bae;
    --line: #222c3d; --gold: #d9b36a; --gold-soft: #2a2416; --ok: #6cc59c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.6 var(--f-body);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }
  .eyebrow {
    font: 500 .72rem/1 var(--f-mono);
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- Topo ---------- */
  .hero {
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(224, 189, 118, .16), transparent 60%),
      radial-gradient(900px 400px at -10% 110%, rgba(80, 120, 200, .18), transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    color: var(--night-ink);
    position: relative; overflow: hidden;
  }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero .wrap { position: relative; padding-block: 20px 56px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .marca { font: 500 .75rem/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--night-muted); }
  .marca b { color: var(--night-gold); font-weight: 500; }
  .lang { display: flex; border: 1px solid var(--night-line); border-radius: 999px; padding: 3px; }
  .lang button {
    font: 500 .75rem/1 var(--f-mono); letter-spacing: .1em;
    background: none; border: 0; color: var(--night-muted);
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--night-ink); color: var(--night); }

  .hero h1 {
    font-family: var(--f-display);
    font-size: clamp(2.6rem, 8.5vw, 5.6rem);
    line-height: .98; letter-spacing: -.01em;
    margin: 56px 0 14px; max-width: 12ch;
  }
  .hero h1 em { color: var(--night-gold); }
  .hero .frase { color: var(--night-muted); font-size: 1.05rem; margin: 0; max-width: 46ch; }

  .board { margin-top: 40px; display: grid; gap: 14px; }
  .board .eyebrow { color: var(--night-muted); }
  .flaps { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
  .unit { display: grid; gap: 8px; }
  .unit .digits { display: flex; gap: 4px; }
  .flap {
    position: relative;
    width: clamp(32px, 8.6vw, 58px); height: clamp(46px, 12.4vw, 80px);
    display: grid; place-items: center;
    background: linear-gradient(180deg, #1b2944 0 50%, #16233b 50% 100%);
    border-radius: 8px;
    font: 700 clamp(1.5rem, 5.6vw, 2.9rem)/1 var(--f-mono);
    color: var(--night-ink);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px rgba(0,0,0,.35);
  }
  .flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.55); }
  .flap.tick { animation: flip .35s ease; }
  @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(-70deg); filter: brightness(.7); } 100% { transform: rotateX(0); } }
  .unit small { font: 500 .68rem/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--night-muted); }
  .sep { font: 700 2rem/1 var(--f-mono); color: var(--night-muted); padding-bottom: 30px; }
  .chegou { font-family: var(--f-display); font-style: italic; font-size: clamp(2rem, 6vw, 3rem); color: var(--night-gold); }
  .partida-txt { color: var(--night-muted); font-size: .92rem; }

  .rota {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--night-line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px;
    font: 500 .85rem/1 var(--f-mono); letter-spacing: .08em; color: var(--night-muted);
  }
  .rota span.cod { color: var(--night-ink); }
  .rota span.cod.casa { color: var(--night-gold); }
  .rota i { width: 16px; height: 1px; background: var(--night-muted); opacity: .5; display: inline-block; }
  .rota i.carro { background: none; border-top: 1px dashed var(--night-muted); height: 0; }

  /* ---------- Menu ---------- */
  nav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
  nav .wrap::-webkit-scrollbar { display: none; }
  nav a {
    flex: none; text-decoration: none; padding: 14px 0;
    font: 500 .74rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid transparent;
  }
  nav a:hover, nav a.ativo { color: var(--ink); border-bottom-color: var(--gold); }

  /* ---------- Seções ---------- */
  section { padding-block: 64px 8px; scroll-margin-top: 48px; }
  .sec-head { display: grid; gap: 8px; margin-bottom: 28px; }
  .sec-head h2 { font-family: var(--f-display); font-size: clamp(2.1rem, 5vw, 3rem); line-height: 1.05; }
  .sec-head p { margin: 0; color: var(--muted); }
  .muted { color: var(--muted); }

  /* Destinos: cartões-postais com foto (ou cena temática enquanto não há foto) */
  .postais { display: grid; gap: 16px; }
  .postal {
    position: relative; overflow: hidden; isolation: isolate;
    min-height: clamp(360px, 52vw, 520px);
    border-radius: 20px; color: #fff;
    display: grid; align-content: end;
    background: #0d1626;
  }
  .postal .foto {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2;
    opacity: 0; transform: scale(1.06); transition: opacity 1.4s ease, transform 7s ease-out;
  }
  .postal .foto.on { opacity: 1; transform: scale(1); }
  .postal .legenda {
    position: absolute; top: 18px; right: 18px; z-index: 1;
    font: 500 .72rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 12px; border-radius: 999px; background: rgba(5,10,20,.45); border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .postal .pontos { display: flex; gap: 6px; }
  .postal .pontos button { width: 22px; height: 3px; padding: 0; border: 0; border-radius: 2px; background: rgba(255,255,255,.35); cursor: pointer; }
  .postal .pontos button[aria-current="true"] { background: #fff; }
  .postal::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(90deg, rgba(5,10,20,.55) 0%, rgba(5,10,20,0) 65%),
      linear-gradient(180deg, rgba(5,10,20,0) 30%, rgba(5,10,20,.55) 62%, rgba(5,10,20,.88) 100%);
  }
  .postal .cena { position: absolute; inset: 0; z-index: -2; }
  .postal .txt { padding: clamp(22px, 4vw, 40px); display: grid; gap: 12px; max-width: 640px; }
  .postal .n { font: 500 .75rem/1 var(--f-mono); letter-spacing: .18em; color: #e8c987; }
  .postal h3 { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 5.6rem); line-height: .92; letter-spacing: -.01em; }
  .postal .datas { font: 500 .9rem/1.3 var(--f-mono); letter-spacing: .04em; }
  .postal .frase { font-size: 1.05rem; margin: 0; color: rgba(255,255,255,.88); }
  .postal .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .postal .chips span {
    font: 500 .78rem/1 var(--f-body); padding: 7px 11px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .postal .obs { font-size: .85rem; color: rgba(255,255,255,.7); }
  .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; max-width: 560px; }
  .galeria figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; border: 1px solid rgba(255,255,255,.25); }
  .galeria img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .galeria figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font: 600 .78rem/1.2 var(--f-body); background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  .creditos { margin-top: 18px; font-size: .75rem; color: var(--muted); max-width: 90ch; margin-inline: auto; line-height: 1.6; }
  .creditos a { color: inherit; }

  /* Cenas temáticas */
  .cena.neve { background:
      radial-gradient(60% 40% at 70% 20%, rgba(255, 214, 150, .28), transparent 70%),
      linear-gradient(180deg, #1d2b45 0%, #33476b 55%, #8aa0bf 100%); }
  .cena.sol { background:
      radial-gradient(circle at 72% 46%, #ffe3a3 0 7%, rgba(255, 196, 120, .7) 12%, transparent 34%),
      linear-gradient(180deg, #1f5f86 0%, #ef8a5f 52%, #f6b77a 60%, #1c8c9a 61%, #0d5c73 100%); }
  .cena.parque { background:
      radial-gradient(50% 40% at 30% 30%, rgba(186, 120, 255, .35), transparent 70%),
      radial-gradient(40% 35% at 75% 25%, rgba(255, 120, 190, .25), transparent 70%),
      linear-gradient(180deg, #120d2e 0%, #2a1a55 60%, #3b2470 100%); }
  .cena canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cena .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; }

  /* Memórias da última viagem */
  .mem-palco {
    position: relative; overflow: hidden; border-radius: 20px; background: #0a1222;
    aspect-ratio: 16 / 10; max-height: 78vh; width: 100%; max-width: 100%;
  }
  .mem-palco .fundo { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.55) saturate(1.2); }
  .mem-palco .principal { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .9s ease; }
  .mem-palco .principal.saindo { opacity: 0; }
  .mem-palco::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(transparent, rgba(5,10,20,.8)); pointer-events: none; }
  .mem-legenda { position: absolute; left: clamp(16px, 3vw, 28px); bottom: clamp(16px, 3vw, 26px); right: 120px; z-index: 2; color: #fff; display: grid; gap: 6px; }
  .mem-legenda .onde { font: 500 .72rem/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: #e8c987; }
  .mem-legenda .txt { font-family: var(--f-display); font-size: clamp(1.4rem, 3.6vw, 2.2rem); line-height: 1.1; text-wrap: balance; }
  .mem-cont { position: absolute; top: 16px; right: 16px; z-index: 2; font: 500 .75rem/1 var(--f-mono); color: #fff; padding: 8px 12px; border-radius: 999px; background: rgba(5,10,20,.45); border: 1px solid rgba(255,255,255,.2); }
  .mem-nav { position: absolute; right: 16px; bottom: 16px; z-index: 2; display: flex; gap: 8px; }
  .mem-nav button {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; color: #fff;
    background: rgba(5,10,20,.45); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .mem-barra { position: absolute; left: 0; top: 0; height: 2px; background: #e8c987; z-index: 3; width: 0; }
  .mem-barra.anda { animation: mem-anda var(--mem-t, 5s) linear forwards; }
  @keyframes mem-anda { to { width: 100%; } }
  .mem-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: thin; }
  .mem-thumbs button { flex: none; width: 64px; height: 64px; padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: .55; background: var(--line); }
  .mem-thumbs button[aria-current="true"] { border-color: var(--gold); opacity: 1; }
  .mem-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 600px) { .mem-palco { aspect-ratio: 4 / 5; } .mem-legenda { right: 16px; bottom: 76px; } }

  /* Cartões de embarque */
  .passes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .pass {
    position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr) 128px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    min-width: 0;
  }
  .pass .main { padding: 18px 20px; display: grid; gap: 14px; min-width: 0; align-content: start; }
  .pass .stub {
    border-left: 1.5px dashed var(--line);
    padding: 18px 16px; display: grid; gap: 4px; align-content: center; text-align: center;
  }
  .pass .furo { position: absolute; right: 120px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); }
  .pass .furo.a { top: -9px; clip-path: inset(50% 0 0 0); }
  .pass .furo.b { bottom: -9px; clip-path: inset(0 0 50% 0); }
  .pass .rota-pass { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
  .pass .cod { font: 700 clamp(1.7rem, 6vw, 2.3rem)/1 var(--f-mono); letter-spacing: .02em; }
  .pass .cidade { font-size: .82rem; color: var(--muted); margin-top: 4px; }
  .pass .linha { position: relative; height: 1px; background: var(--line); }
  .pass .linha::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); transform: translate(-50%, -50%);
  }
  .pass.carro .linha { background: none; border-top: 1.5px dashed var(--line); height: 0; }
  .pass .dir { text-align: right; }
  .pass .horas { display: flex; justify-content: space-between; gap: 10px; font: 500 .85rem/1.3 var(--f-mono); }
  .pass .horas b { display: block; font-size: 1.1rem; font-weight: 700; }
  .pass .nota { font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .pass .stub .voo { font: 700 1.05rem/1.2 var(--f-mono); }
  .pass .stub .cia { font-size: .78rem; color: var(--muted); }
  .pass .stub .eyebrow { margin-bottom: 4px; }

  /* Hospedagem */
  .hoteis { display: grid; border-top: 1px solid var(--line); }
  .hotel { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 8px 28px; padding-block: 24px; border-bottom: 1px solid var(--line); align-items: start; }
  .hotel .eyebrow { padding-top: 10px; }
  .hotel h3 { font-family: var(--f-display); font-size: 1.75rem; line-height: 1.1; }
  .hotel .end { font: 400 .85rem/1.5 var(--f-mono); color: var(--muted); margin-top: 6px; }
  .hotel .obs { margin: 8px 0 0; font-size: .95rem; }
  .hotel .estadia { display: flex; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  .hotel .estadia div { display: grid; gap: 6px; }
  .hotel .estadia b { font: 500 .95rem/1.2 var(--f-mono); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font: 600 .85rem/1 var(--f-body); text-decoration: none;
    padding: 11px 16px; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink); }
  .btn.perigo { background: transparent; color: var(--gold); border-color: var(--gold); }

  /* Roteiro */
  .dias { display: grid; }
  .dia { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 24px; padding-block: 26px; border-top: 1px solid var(--line); }
  .dia .data { display: grid; align-content: start; gap: 4px; }
  .dia .data .num { font-family: var(--f-display); font-size: 3.4rem; line-height: .9; }
  .dia .data .mes { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .dia h3 { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .tag { font: 600 .68rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--gold); color: var(--surface); }
  .dia.passou { opacity: .5; }
  .ativs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; }
  .ativ { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding-block: 10px; }
  .ativ + .ativ { border-top: 1px dashed var(--line); }
  .ativ time { font: 500 .9rem/1.6 var(--f-mono); color: var(--gold); }
  .ativ .nome { font-weight: 600; }
  .ativ .local { font-size: .9rem; color: var(--muted); }
  .ativ .local a { text-decoration-color: var(--line); text-underline-offset: 3px; }
  .ativ .local a:hover { text-decoration-color: var(--gold); }
  .ativ .carro { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin-top: 6px; font: 500 .8rem/1.4 var(--f-mono); color: var(--ink); }
  .ativ .carro b { font-weight: 700; color: var(--gold); }
  .ativ .carro span { color: var(--muted); font-family: var(--f-body); font-size: .82rem; }
  .ativ .obs { display: inline-block; margin-top: 6px; font-size: .86rem; background: var(--gold-soft); padding: 4px 10px; border-radius: 8px; }

  /* Checklist */
  .check-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: end; margin-bottom: 26px; }
  .campo { display: grid; gap: 8px; max-width: 360px; }
  .campo input, .add input {
    font: 500 1rem/1.2 var(--f-body); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; width: 100%; min-width: 0;
  }
  .progresso { display: grid; gap: 8px; min-width: 220px; }
  .progresso .txt { font: 500 .85rem/1 var(--f-mono); }
  .barra { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .barra div { height: 100%; width: 0; background: var(--gold); transition: width .4s ease; }
  .cats { columns: 2 320px; column-gap: 40px; }
  .cat { break-inside: avoid; margin-bottom: 30px; }
  .cat h3 { font-family: var(--f-display); font-size: 1.45rem; margin-bottom: 8px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .item input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; border: 1.5px solid var(--muted); border-radius: 6px; display: grid; place-items: center; cursor: pointer; flex: none; background: var(--surface); }
  .item input:checked { background: var(--ok); border-color: var(--ok); }
  .item input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .item label { flex: 1; cursor: pointer; font-size: .96rem; min-width: 0; }
  .item.done label { color: var(--muted); text-decoration: line-through; }
  .item .del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; opacity: .5; }
  .item:hover .del, .item .del:focus-visible { opacity: 1; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { padding: 9px 12px; font-size: .92rem; }
  .add button { flex: none; width: 40px; justify-content: center; padding: 0; }
  .check-foot { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }
  .check-foot p { margin: 0; font-size: .85rem; color: var(--muted); max-width: 52ch; }
  .confirma { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }

  /* Contatos */
  .contatos { display: grid; border-top: 1px solid var(--line); }
  .contato { display: flex; justify-content: space-between; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .contato a { font: 700 1.2rem/1 var(--f-mono); text-decoration: none; color: var(--gold); white-space: nowrap; }

  footer { padding-block: 72px 48px; text-align: center; }
  footer p { font-family: var(--f-display); font-style: italic; font-size: 1.4rem; color: var(--muted); margin: 0; }

  @media (max-width: 720px) {
    .hotel { grid-template-columns: minmax(0, 1fr); }
    .hotel .eyebrow { padding-top: 0; }
    .hotel .btn { justify-self: start; }
    .dia { grid-template-columns: 60px minmax(0, 1fr); gap: 16px; }
    .dia .data .num { font-size: 2.6rem; }
    .check-top { grid-template-columns: minmax(0, 1fr); }
    .progresso { min-width: 0; }
  }
  @media (max-width: 480px) {
    .wrap { padding-inline: 16px; }
    .pass { grid-template-columns: minmax(0, 1fr) 92px; }
    .pass .furo { right: 84px; }
    .pass .main { padding: 16px; }
    .pass .stub { padding: 14px 8px; }
    .sep { display: none; }
    .flaps { gap: 10px 12px; }
    .unit .digits { gap: 3px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .flap.tick { animation: none; }
    .barra div { transition: none; }
  }
</style>
</head>

<script src="viagem.js?v=202610081204"></script>
<script src="memorias.js?v=202610081204"></script>
<script>
  const V = VIAGEM;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---------- Textos fixos do site ----------
  const UI = {
    pt: {
      marca: "Fim de ano · <b>2026/27</b>",
      dias: "dias", horas: "horas", min: "min", seg: "seg",
      boardLabel: "Embarque em", ateAPartida: "Partida", as: "às",
      ferias: "Estamos de férias.", volta: "Chegada em casa",
      fim: "Até a próxima viagem.",
      navDestinos: "Destinos", navTrajetos: "Voos", navHoteis: "Hospedagem",
      navRoteiro: "Roteiro", navChecklist: "Checklist", navContatos: "Contatos",
      eDestinos: "O caminho", tDestinos: "Três cidades, dezenove dias",
      eTrajetos: "Cartões de embarque", tTrajetos: "Voos e estradas",
      eHoteis: "Onde vamos dormir", tHoteis: "Hospedagem",
      eRoteiro: "Dia a dia", tRoteiro: "Roteiro", deCasa: "Carro desde a casa:",
      notaCarro: "Tempos de carro saindo da casa em Kissimmee, sem trânsito. Nos feriados, conte com até o dobro.",
      eChecklist: "Antes de fechar a mala", tChecklist: "Checklist",
      eContatos: "Para guardar", tContatos: "Contatos importantes",
      horaLocal: "Horários no fuso local de cada cidade.",
      deCarro: "De carro", carro: "Estrada", voo: "Voo", vooAConfirmar: "A confirmar", aConfirmar: "a confirmar",
      checkin: "Check-in", checkout: "Check-out", estadia: "Estadia", reserva: "Reserva",
      noite: "noite", noites: "noites", enderecoAConfirmar: "Endereço a confirmar",
      abrirMapa: "Abrir no mapa", hoje: "Hoje",
      checklistDe: "Checklist de", seuNome: "Seu nome",
      adicionar: "Adicionar item", remover: "Remover",
      desmarcar: "Desmarcar tudo", confirmaDesmarcar: "Desmarcar todos os itens?", sim: "Sim, desmarcar", nao: "Cancelar",
      prontos: (f, t, p) => `${f}/${t} itens · ${p}%`, malaPronta: "Mala pronta.",
      salvoAqui: "As marcações ficam salvas neste aparelho. Cada pessoa usa o seu.",
      rodape: "Feito para a nossa família.", fotos: "Fotos",
      navMemorias: "Memórias", eMemorias: "Da última viagem", tMemorias: "Nossas memórias", anterior: "Foto anterior", proxima: "Próxima foto",
    },
    en: {
      marca: "Holiday trip · <b>2026/27</b>",
      dias: "days", horas: "hours", min: "min", seg: "sec",
      boardLabel: "Boarding in", ateAPartida: "Departure", as: "at",
      ferias: "We're on vacation.", volta: "Back home",
      fim: "Until the next trip.",
      navDestinos: "Destinations", navTrajetos: "Flights", navHoteis: "Stays",
      navRoteiro: "Itinerary", navChecklist: "Checklist", navContatos: "Contacts",
      eDestinos: "The route", tDestinos: "Three cities, nineteen days",
      eTrajetos: "Boarding passes", tTrajetos: "Flights & drives",
      eHoteis: "Where we sleep", tHoteis: "Stays",
      eRoteiro: "Day by day", tRoteiro: "Itinerary", deCasa: "Drive from the house:",
      notaCarro: "Drive times from the Kissimmee house, without traffic. Around the holidays, allow up to twice as long.",
      eChecklist: "Before you zip the bag", tChecklist: "Checklist",
      eContatos: "Keep these handy", tContatos: "Important contacts",
      horaLocal: "All times are local to each city.",
      deCarro: "By car", carro: "Road", voo: "Flight", vooAConfirmar: "TBD", aConfirmar: "TBD",
      checkin: "Check-in", checkout: "Check-out", estadia: "Stay", reserva: "Booking",
      noite: "night", noites: "nights", enderecoAConfirmar: "Address TBD",
      abrirMapa: "Open in Maps", hoje: "Today",
      checklistDe: "Checklist for", seuNome: "Your name",
      adicionar: "Add item", remover: "Remove",
      desmarcar: "Uncheck all", confirmaDesmarcar: "Uncheck every item?", sim: "Yes, uncheck", nao: "Cancel",
      prontos: (f, t, p) => `${f}/${t} items · ${p}%`, malaPronta: "All packed.",
      salvoAqui: "Your checks are saved on this device. Each person uses their own.",
      rodape: "Made for our family.", fotos: "Photos",
      navMemorias: "Memories", eMemorias: "From our last trip", tMemorias: "Our memories", anterior: "Previous photo", proxima: "Next photo",
    },
  };

  let lang = store.get("idioma", "pt") === "en" ? "en" : "pt";
  const L = () => UI[lang];
  const locale = () => (lang === "en" ? "en-US" : "pt-BR");
  // Texto que pode ser "simples" ou { pt, en }
  const tx = (v) => (v && typeof v === "object" ? v[lang] ?? v.pt ?? "" : v ?? "");

  // Datas "AAAA-MM-DD" ou "AAAA-MM-DDTHH:MM" lidas no horário local
  function data(txt) {
    const [d, t = "00:00"] = txt.split("T");
    const [a, m, dia] = d.split("-").map(Number);
    const [h, min] = t.split(":").map(Number);
    return new Date(a, m - 1, dia, h, min);
  }
  const fmtDia = (d) => d.toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" });
  const fmtCurto = (d) => d.toLocaleDateString(locale(), { day: "2-digit", month: "short" }).replace(".", "").replace(" de ", " ");
  const curto = (txt) => (txt ? fmtCurto(data(txt)) : L().aConfirmar);
  const mapa = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const tel = (t) => "tel:" + String(t).replace(/[^\d+]/g, "");

  // ---------- Contador (painel de embarque) ----------
  const partida = new Date(V.partida);
  const retorno = V.retorno ? data(V.retorno) : null;
  let timer = null, ultimo = {};

  function montaPainel() {
    const u = (id, label) => `<div class="unit"><div class="digits" id="u-${id}"></div><small>${label}</small></div>`;
    $("contador").innerHTML = `<div class="flaps">${u("d", L().dias)}<span class="sep">:</span>${u("h", L().horas)}<span class="sep">:</span>${u("m", L().min)}<span class="sep">:</span>${u("s", L().seg)}</div>`;
    ultimo = {};
  }
  function setFlaps(id, valor) {
    const box = $("u-" + id); if (!box) return;
    if (box.children.length !== valor.length) box.innerHTML = [...valor].map(() => '<span class="flap"></span>').join("");
    [...valor].forEach((c, i) => {
      const el = box.children[i];
      if (el.textContent !== c) {
        el.textContent = c;
        if (ultimo[id] !== undefined) { el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); }
      }
    });
    ultimo[id] = valor;
  }
  function tick() {
    const agora = new Date();
    const falta = partida - agora;
    if (falta > 0) {
      const s = Math.floor(falta / 1000);
      setFlaps("d", String(Math.floor(s / 86400)).padStart(2, "0"));
      setFlaps("h", String(Math.floor((s % 86400) / 3600)).padStart(2, "0"));
      setFlaps("m", String(Math.floor((s % 3600) / 60)).padStart(2, "0"));
      setFlaps("s", String(s % 60).padStart(2, "0"));
      return false;
    }
    $("boardLabel").textContent = "";
    if (!retorno || agora < retorno) {
      $("contador").innerHTML = `<div class="chegou">${esc(L().ferias)}</div>`;
      $("sub").textContent = retorno ? `${L().volta} · ${fmtDia(retorno)}` : "";
    } else {
      $("contador").innerHTML = `<div class="chegou">${esc(L().fim)}</div>`;
      $("sub").textContent = "";
    }
    return true;
  }

  // ---------- Montagem ----------
  function renderTudo() {
    document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    document.title = tx(V.titulo);
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = L()[el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", L()[el.dataset.i18nAria]));
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("pessoa").placeholder = L().seuNome;
    $("marca").innerHTML = L().marca;

    // Título: última palavra em itálico dourado
    const t = tx(V.titulo).split(" ");
    const fim = t.pop();
    $("titulo").innerHTML = `${esc(t.join(" "))} <em>${esc(fim)}</em>`;
    $("frase").textContent = tx(V.frase);

    // Painel
    const tz = { timeZone: "America/Sao_Paulo" };
    $("boardLabel").textContent = L().boardLabel;
    $("sub").textContent = `${L().ateAPartida} · ${partida.toLocaleDateString(locale(), { ...tz, weekday: "long", day: "numeric", month: "long" })} ${L().as} ${partida.toLocaleTimeString(locale(), { ...tz, hour: "2-digit", minute: "2-digit" })} · Curitiba (CWB)`;
    montaPainel();
    if (tick()) { clearInterval(timer); timer = null; }
    else if (!timer) timer = setInterval(() => { if (tick()) { clearInterval(timer); timer = null; } }, 1000);

    // Rota completa em códigos de aeroporto
    const casa = V.trajetos[0].sai.sigla;
    const pontos = [{ cod: casa }].concat(V.trajetos.map((v) => ({ cod: v.chega.sigla, carro: v.tipo === "carro" })));
    $("rota").innerHTML = pontos.map((p, i) =>
      (i ? `<i class="${p.carro ? "carro" : ""}"></i>` : "") + `<span class="cod ${p.cod === casa ? "casa" : ""}">${esc(p.cod)}</span>`
    ).join("");

    // Destinos (cartões-postais)
    $("etapas").innerHTML = V.destinos.map((d, i) => `<article class="postal" data-i="${i}">
        ${fotosDe(d).length
          ? fotosDe(d).map((f, k) => `<img class="foto ${k ? "" : "on"}" src="${esc(f.src)}" alt="${esc(tx(f.legenda) || tx(d.cidade))}" ${k ? 'loading="lazy"' : ""}>`).join("")
            + `<span class="legenda">${esc(tx(fotosDe(d)[0].legenda))}</span>`
          : `<div class="cena ${esc(d.tema)}" data-tema="${esc(d.tema)}">${CENAS[d.tema] || ""}</div>`}
        <div class="txt">
          <span class="n">${String(i + 1).padStart(2, "0")} · ${esc(curto(d.de))} → ${esc(curto(d.ate))}</span>
          <h3>${esc(tx(d.cidade))}</h3>
          ${tx(d.frase) ? `<p class="frase">${esc(tx(d.frase))}</p>` : ""}
          ${d.destaques ? `<div class="chips">${d.destaques.map((x) => `<span>${esc(tx(x))}</span>`).join("")}</div>` : ""}
          ${tx(d.obs) ? `<div class="obs">${esc(tx(d.obs))}</div>` : ""}
          ${fotosDe(d).length > 1 ? `<div class="pontos">${fotosDe(d).map((f, k) => `<button type="button" data-ir="${k}" aria-label="${esc(tx(f.legenda))}" aria-current="${!k}"></button>`).join("")}</div>` : ""}
        </div>
      </article>`).join("");
    animaCenas();
    iniciaSlides();

    // Cartões de embarque
    $("listaVoos").innerHTML = V.trajetos.map((v) => {
      const carro = v.tipo === "carro";
      const hora = (p, dir) => `<div class="${dir ? "dir" : ""}"><b>${esc(p.hora || "—")}</b><span class="muted">${esc(curto(p.data))}</span></div>`;
      return `<article class="pass ${carro ? "carro" : ""}">
        <span class="furo a"></span><span class="furo b"></span>
        <div class="main">
          <span class="eyebrow">${esc(tx(v.trecho))}</span>
          <div class="rota-pass">
            <div><div class="cod">${esc(v.sai.sigla)}</div><div class="cidade">${esc(tx(v.sai.cidade))}</div></div>
            <div class="linha"></div>
            <div class="dir"><div class="cod">${esc(v.chega.sigla)}</div><div class="cidade">${esc(tx(v.chega.cidade))}</div></div>
          </div>
          ${carro ? "" : `<div class="horas">${hora(v.sai)}${hora(v.chega, true)}</div>`}
          ${tx(v.obs) ? `<div class="nota">${esc(tx(v.obs))}</div>` : ""}
        </div>
        <div class="stub">
          <span class="eyebrow">${carro ? L().carro : L().voo}</span>
          <span class="voo">${esc(carro ? curto(v.sai.data) : v.voo || L().vooAConfirmar)}</span>
          <span class="cia">${esc(carro ? L().deCarro : v.companhia)}</span>
        </div>
      </article>`;
    }).join("");

    // Hospedagem
    $("listaHoteis").innerHTML = V.hoteis.map((H) => {
      let noites = "";
      if (H.checkin && H.checkout) {
        const n = Math.round((data(H.checkout) - data(H.checkin)) / 86400000);
        noites = `${n} ${n === 1 ? L().noite : L().noites}`;
      }
      return `<article class="hotel">
        <span class="eyebrow">${esc(tx(H.cidade))}</span>
        <div>
          <h3>${esc(tx(H.nome))}</h3>
          <div class="end">${esc(H.endereco || L().enderecoAConfirmar)}</div>
          ${tx(H.obs) ? `<p class="obs">${esc(tx(H.obs))}</p>` : ""}
          <div class="estadia">
            <div><span class="eyebrow">${L().checkin}</span><b>${esc(curto(H.checkin))}</b></div>
            <div><span class="eyebrow">${L().checkout}</span><b>${esc(curto(H.checkout))}</b></div>
            ${noites ? `<div><span class="eyebrow">${L().estadia}</span><b>${esc(noites)}</b></div>` : ""}
            ${H.reserva ? `<div><span class="eyebrow">${L().reserva}</span><b>${esc(H.reserva)}</b></div>` : ""}
            ${H.telefone ? `<div><span class="eyebrow">Tel.</span><b><a href="${tel(H.telefone)}">${esc(H.telefone)}</a></b></div>` : ""}
          </div>
        </div>
        ${H.endereco ? `<a class="btn ghost" href="${mapa(tx(H.nome) + ", " + H.endereco)}" target="_blank" rel="noopener">${L().abrirMapa} ↗</a>` : "<span></span>"}
      </article>`;
    }).join("");

    // Roteiro
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    $("dias").innerHTML = V.roteiro.map((d) => {
      const dia = data(d.dia);
      const cls = +dia === +hoje ? "hoje" : dia < hoje ? "passou" : "";
      const mes = dia.toLocaleDateString(locale(), { month: "short" }).replace(".", "");
      const sem = dia.toLocaleDateString(locale(), { weekday: "short" }).replace(".", "");
      return `<article class="dia ${cls}">
        <div class="data"><span class="num">${dia.getDate()}</span><span class="mes">${esc(mes)}<br>${esc(sem)}</span></div>
        <div>
          <h3>${esc(tx(d.titulo))}${cls === "hoje" ? `<span class="tag">${L().hoje}</span>` : ""}</h3>
          <ul class="ativs">${d.atividades.map((a) => `<li class="ativ">
            <time>${esc(a.hora || "—")}</time>
            <div>
              <div class="nome">${esc(tx(a.nome))}</div>
              ${a.local ? `<div class="local"><a href="${mapa(tx(a.local))}" target="_blank" rel="noopener">${esc(tx(a.local))}</a></div>` : ""}
              ${a.carro ? `<div class="carro">${L().deCasa} <b>~${a.carro.min} min</b> · ${a.carro.km} km${tx(a.carro.de) ? `<span>${esc(tx(a.carro.de))}</span>` : ""}</div>` : ""}
              ${tx(a.obs) ? `<div class="obs">${esc(tx(a.obs))}</div>` : ""}
            </div>
          </li>`).join("")}</ul>
        </div>
      </article>`;
    }).join("");

    renderChecklist();
    renderLimpar(false);
    renderMemorias();

    // Créditos das fotos (exigidos pelas licenças Creative Commons)
    $("creditos").innerHTML = (V.creditos || []).length
      ? `${L().fotos}: ` + V.creditos.map((c) => `<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(tx(c.oque))}</a> · ${esc(c.autor)} (${esc(c.licenca)})`).join(" — ")
      : "";

    // Contatos
    $("listaContatos").innerHTML = V.contatos.map((c) =>
      `<div class="contato"><span>${esc(tx(c.nome))}</span><a href="${tel(c.telefone)}">${esc(c.telefone)}</a></div>`
    ).join("");
  }

  // ---------- Checklist ----------
  // O texto em português é o identificador de cada item; trocar de idioma não perde marcações.
  let estado = store.get("checklist-estado", { marcados: {}, extras: {}, removidos: {} });
  const salvar = () => store.set("checklist-estado", estado);
  $("pessoa").value = store.get("checklist-nome", "");
  $("pessoa").addEventListener("input", (e) => store.set("checklist-nome", e.target.value));

  function renderChecklist() {
    let total = 0, feitos = 0;
    $("cats").innerHTML = V.checklist.map((grupo, gi) => {
      const cat = grupo.categoria.pt ?? grupo.categoria;
      const lista = [
        ...grupo.itens.map((i) => ({ id: i.pt ?? i, txt: tx(i) })),
        ...(estado.extras[cat] || []).map((i) => ({ id: i, txt: i })),
      ].filter((i) => !estado.removidos[cat + "|" + i.id]);
      const html = lista.map((item, ii) => {
        const key = cat + "|" + item.id;
        const ok = !!estado.marcados[key];
        total++; if (ok) feitos++;
        const id = `chk-${gi}-${ii}`;
        return `<div class="item ${ok ? "done" : ""}">
          <input type="checkbox" id="${id}" data-key="${esc(key)}" ${ok ? "checked" : ""}>
          <label for="${id}">${esc(item.txt)}</label>
          <button type="button" class="del" aria-label="${L().remover}: ${esc(item.txt)}" data-del="${esc(key)}">×</button>
        </div>`;
      }).join("");
      return `<div class="cat">
        <h3>${esc(tx(grupo.categoria))}</h3>
        ${html}
        <form class="add" data-cat="${esc(cat)}">
          <input id="add-${gi}" placeholder="${esc(L().adicionar)}" maxlength="80" aria-label="${esc(L().adicionar)}">
          <button class="btn ghost" type="submit" aria-label="${esc(L().adicionar)}">+</button>
        </form>
      </div>`;
    }).join("");
    const pct = total ? Math.round((feitos / total) * 100) : 0;
    $("barra").style.width = pct + "%";
    $("progressoTxt").textContent = pct === 100 ? L().malaPronta : L().prontos(feitos, total, pct);
  }

  // Confirmação dentro da página (sem janelas pop-up)
  function renderLimpar(perguntando) {
    $("limparBox").innerHTML = perguntando
      ? `<div class="confirma"><span>${L().confirmaDesmarcar}</span>
           <button type="button" class="btn perigo" id="limparSim">${L().sim}</button>
           <button type="button" class="btn ghost" id="limparNao">${L().nao}</button></div>`
      : `<button type="button" class="btn ghost" id="limpar">${L().desmarcar}</button>`;
  }
  $("limparBox").addEventListener("click", (e) => {
    if (e.target.id === "limpar") renderLimpar(true);
    else if (e.target.id === "limparNao") renderLimpar(false);
    else if (e.target.id === "limparSim") { estado.marcados = {}; salvar(); renderChecklist(); renderLimpar(false); }
  });

  $("cats").addEventListener("change", (e) => {
    const k = e.target.dataset.key; if (!k) return;
    if (e.target.checked) estado.marcados[k] = true; else delete estado.marcados[k];
    salvar(); renderChecklist();
  });
  $("cats").addEventListener("click", (e) => {
    const k = e.target.dataset.del; if (!k) return;
    estado.removidos[k] = true; delete estado.marcados[k];
    salvar(); renderChecklist();
  });
  $("cats").addEventListener("submit", (e) => {
    e.preventDefault();
    const cat = e.target.dataset.cat;
    const txt = e.target.querySelector("input").value.trim();
    if (!txt) return;
    estado.extras[cat] = [...(estado.extras[cat] || []), txt];
    delete estado.removidos[cat + "|" + txt];
    salvar(); renderChecklist();
  });

  // ---------- Idioma ----------
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    store.set("idioma", lang);
    renderTudo();
  }));

  // ---------- Menu: destaca a seção visível ----------
  const links = [...document.querySelectorAll("nav a")];
  const obs = new IntersectionObserver((ents) => {
    ents.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle("ativo", a.getAttribute("href") === "#" + en.target.id)); });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("main section").forEach((s) => obs.observe(s));

  // ---------- Memórias (fotos da última viagem) ----------
  const MEM = typeof MEMORIAS !== "undefined" ? MEMORIAS : [];
  const MEM_T = 5000;
  let memI = 0, memTimer = null, memPausa = false;
  function memMostra(i, anima = true) {
    if (!MEM.length) return;
    memI = (i + MEM.length) % MEM.length;
    const m = MEM[memI], foto = $("memFoto");
    const troca = () => {
      foto.src = m.src; foto.alt = m[lang] || m.pt; $("memFundo").src = m.src;
      foto.classList.remove("saindo");
    };
    if (anima && foto.src) { foto.classList.add("saindo"); setTimeout(troca, 450); } else troca();
    $("memOnde").textContent = m.onde || "";
    $("memTxt").textContent = m[lang] || m.pt;
    $("memCont").textContent = `${String(memI + 1).padStart(2, "0")} / ${String(MEM.length).padStart(2, "0")}`;
    $("memThumbs").querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-current", k === memI));
    const atual = $("memThumbs").children[memI];
    if (atual) $("memThumbs").scrollTo({ left: atual.offsetLeft - $("memThumbs").clientWidth / 2 + 32, behavior: anima ? "smooth" : "auto" });
    // pré-carrega a próxima
    const prox = new Image(); prox.src = MEM[(memI + 1) % MEM.length].src;
    memAgenda();
  }
  function memAgenda() {
    clearTimeout(memTimer);
    const barra = $("memBarra");
    barra.classList.remove("anda"); void barra.offsetWidth;
    if (memPausa || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    barra.style.setProperty("--mem-t", MEM_T + "ms"); barra.classList.add("anda");
    memTimer = setTimeout(() => memMostra(memI + 1), MEM_T);
  }
  function renderMemorias() {
    if (!MEM.length) return;
    $("memorias").hidden = false; $("navMem").hidden = false;
    if (!$("memThumbs").children.length) {
      $("memThumbs").innerHTML = MEM.map((m, k) => `<button type="button" data-k="${k}" aria-label="${esc(m.pt)}"><img src="${esc(m.src)}" alt="" loading="lazy"></button>`).join("");
      memMostra(0, false);
    } else memMostra(memI, false);
  }
  if (MEM.length) {
    $("memAnt").addEventListener("click", () => memMostra(memI - 1));
    $("memProx").addEventListener("click", () => memMostra(memI + 1));
    $("memThumbs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) memMostra(+b.dataset.k); });
    const palco = $("memPalco");
    palco.addEventListener("mouseenter", () => { memPausa = true; memAgenda(); });
    palco.addEventListener("mouseleave", () => { memPausa = false; memAgenda(); });
    let x0 = null;
    palco.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    palco.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) memMostra(memI + (dx < 0 ? 1 : -1)); x0 = null; });
    document.addEventListener("visibilitychange", () => { memPausa = document.hidden; memAgenda(); });
  }

  // ---------- Fotos que passam sozinhas ----------
  // Aceita "fotos: [{ src, legenda }]" ou o formato antigo "foto: '...'".
  const fotosDe = (d) => d.fotos && d.fotos.length ? d.fotos : d.foto ? [{ src: d.foto, legenda: "" }] : [];
  let slideTimer = null;
  function mostra(postal, i) {
    const imgs = postal.querySelectorAll(".foto");
    if (!imgs.length) return;
    i = (i + imgs.length) % imgs.length;
    imgs.forEach((im, k) => im.classList.toggle("on", k === i));
    postal.querySelectorAll(".pontos button").forEach((b, k) => b.setAttribute("aria-current", k === i));
    const d = V.destinos[+postal.dataset.i];
    postal.querySelector(".legenda").textContent = tx(fotosDe(d)[i].legenda);
    postal.dataset.atual = i;
  }
  function iniciaSlides() {
    clearInterval(slideTimer);
    const postais = [...document.querySelectorAll(".postal")].filter((p) => p.querySelectorAll(".foto").length > 1);
    if (!postais.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let passo = 0;
    // Troca um cartão por vez, em sequência, a cada 2,5 s (cada cartão muda a cada ~7 s)
    slideTimer = setInterval(() => {
      const p = postais[passo++ % postais.length];
      if (!p.matches(":hover")) mostra(p, (+p.dataset.atual || 0) + 1);
    }, 2500);
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".pontos button"); if (!b) return;
    mostra(b.closest(".postal"), +b.dataset.ir);
  });

  // ---------- Cenas temáticas dos destinos ----------
  const CENAS = {
    neve: `<svg class="skyline" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0c1424" d="M0 120V78h14V60h10v18h8V40h6V22h4v18h6v38h10V52h18v26h6V30l8-10 8 10v48h8V58h14v20h10V12h3V0h2v12h3v66h8V48h16v30h6V64h12v14h10V36h12v42h8V56h18v22h6V44h4V30h6v14h4v34h10V62h16v16h8V50h14v28h10V70h14v8h14V58h12v20H400V120z"/>
      <g fill="#ffd58a" opacity=".75"><rect x="44" y="50" width="2" height="2"/><rect x="48" y="58" width="2" height="2"/><rect x="104" y="40" width="2" height="2"/><rect x="108" y="50" width="2" height="2"/><rect x="148" y="30" width="2" height="2"/><rect x="152" y="44" width="2" height="2"/><rect x="186" y="58" width="2" height="2"/><rect x="236" y="48" width="2" height="2"/><rect x="240" y="60" width="2" height="2"/><rect x="290" y="56" width="2" height="2"/><rect x="330" y="62" width="2" height="2"/></g>
    </svg><canvas data-fx="neve"></canvas>`,
    sol: `<svg class="skyline" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0b3a4a" opacity=".9" d="M0 120V96h20V70h8v26h10V60h12v36h8V50h6V40h4v10h6v46h10V66h14v30h12V56h10v40h20V76h8v20h200v24z"/>
      <g fill="#0a2a33"><path d="M330 120c2-26 4-40 10-56-8 4-16 2-22-4 8 0 16-2 22-6-8-4-14-10-16-18 8 4 14 10 18 16 0-8 4-16 10-20-2 8-2 16 0 22 6-6 14-8 22-6-6 4-14 8-20 10 8 2 14 8 16 16-8-4-14-8-20-8-4 16-6 30-6 54z"/></g>
    </svg><canvas data-fx="sol"></canvas>`,
    parque: `<svg class="skyline" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0b0820" d="M0 120V92h40V80h12v12h30V70l6-10 6 10v22h14V58l8-14 8 14v-10l6-12 6 12v10l8-14 8 14v34h14V66l6-10 6 10v26h30V84h20v8h40c4-30 14-50 30-56 16 6 26 26 30 56h12v28z"/>
      <circle cx="330" cy="96" r="22" fill="none" stroke="#0b0820" stroke-width="3"/>
    </svg><canvas data-fx="fogos"></canvas>`,
  };

  let cenaRAF = null;
  function animaCenas() {
    cancelAnimationFrame(cenaRAF);
    const calma = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const telas = [...document.querySelectorAll(".cena canvas")].map((c) => {
      const r = devicePixelRatio || 1, w = c.offsetWidth, h = c.offsetHeight;
      c.width = w * r; c.height = h * r;
      const ctx = c.getContext("2d"); ctx.setTransform(r, 0, 0, r, 0, 0);
      const fx = c.dataset.fx;
      const n = fx === "neve" ? Math.round(w * h / 2600) : fx === "sol" ? 40 : 0;
      const parts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + .6, v: Math.random() * .6 + .3, f: Math.random() * 6.28 }));
      return { c, ctx, w, h, fx, parts, fogos: [] };
    });
    function quadro(t) {
      for (const s of telas) {
        const { ctx, w, h } = s;
        ctx.clearRect(0, 0, w, h);
        if (s.fx === "neve") {
          ctx.fillStyle = "rgba(255,255,255,.85)";
          for (const p of s.parts) {
            if (!calma) { p.y += p.v; p.x += Math.sin(t / 1200 + p.f) * .3; if (p.y > h) { p.y = -4; p.x = Math.random() * w; } }
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
          }
        } else if (s.fx === "sol") {
          for (const p of s.parts) {
            const y = h * .62 + (p.y / h) * h * .3;
            const a = calma ? .3 : .15 + .35 * Math.abs(Math.sin(t / 900 + p.f));
            ctx.fillStyle = `rgba(255,236,190,${a})`;
            ctx.fillRect(p.x, y, p.r * 6, 1);
          }
        } else if (s.fx === "fogos") {
          if (!calma && Math.random() < .03) {
            const cx = w * (.15 + Math.random() * .7), cy = h * (.12 + Math.random() * .3);
            const cor = ["255,214,140", "255,140,200", "170,190,255", "190,255,220"][Math.floor(Math.random() * 4)];
            s.fogos.push(...Array.from({ length: 44 }, (_, i) => { const ang = i / 44 * 6.28, v = 1 + Math.random() * 1.6; return { x: cx, y: cy, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, vida: 1, cor }; }));
          }
          if (calma && !s.fogos.length) {
            [[.3, .22], [.7, .3]].forEach(([fx, fy]) => { for (let i = 0; i < 44; i++) { const ang = i / 44 * 6.28; s.fogos.push({ x: w * fx + Math.cos(ang) * 40, y: h * fy + Math.sin(ang) * 40, vx: 0, vy: 0, vida: .8, cor: "255,214,140" }); } });
          }
          s.fogos = s.fogos.filter((p) => p.vida > 0);
          for (const p of s.fogos) {
            if (!calma) { p.x += p.vx; p.y += p.vy; p.vy += .02; p.vx *= .985; p.vy *= .985; p.vida -= .012; }
            ctx.fillStyle = `rgba(${p.cor},${p.vida})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.28); ctx.fill();
          }
        }
      }
      if (!calma) cenaRAF = requestAnimationFrame(quadro);
    }
    cenaRAF = requestAnimationFrame(quadro);
  }
  addEventListener("resize", () => { clearTimeout(animaCenas.t); animaCenas.t = setTimeout(animaCenas, 200); });

  // ---------- Céu estrelado ----------
  (function ceu() {
    const c = $("ceu"), ctx = c.getContext("2d");
    const calma = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let estrelas = [], w, h;
    function tamanho() {
      const r = devicePixelRatio || 1;
      w = c.offsetWidth; h = c.offsetHeight;
      c.width = w * r; c.height = h * r; ctx.setTransform(r, 0, 0, r, 0, 0);
      estrelas = Array.from({ length: Math.round(w * h / 5000) }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.1 + .2, f: Math.random() * Math.PI * 2,
      }));
    }
    function quadro(t) {
      ctx.clearRect(0, 0, w, h);
      for (const s of estrelas) {
        const a = calma ? .6 : .35 + .35 * Math.sin(t / 1400 + s.f);
        ctx.fillStyle = `rgba(238,242,248,${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!calma) requestAnimationFrame(quadro);
    }
    tamanho(); addEventListener("resize", tamanho); requestAnimationFrame(quadro);
  })();

  renderTudo();
</script>
</body>
</html>
